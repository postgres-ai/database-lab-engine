.job_template: &build_image_definition
  image: docker:24
  stage: build
  artifacts:
    paths:
      - engine/bin
  services:
    - name: docker:24-dind
      alias: docker
      command: [ "--tls=false" ]
  script:
    - cd engine
    - apk update && apk upgrade && apk add --no-cache bash # TODO(anatoly): Remove dependency.
    - bash ./scripts/ci_docker_build_push.sh

# The clone major upgrade image is built per target major from the matching extended-postgres
# image, so it is parameterized by PG_MAJOR through a parallel matrix. It deliberately does not
# reuse *build_image_definition: that template publishes engine/bin as artifacts, and this image
# contains no engine binary. The resulting tag mirrors the base tag (PG_UPGRADE_BASE_TAG), so
# pinning the base to "17-0.8.0" produces pg-upgrade:17-0.8.0.
.pg_upgrade_job_template: &build_pg_upgrade_image_definition
  image: docker:24
  stage: build
  services:
    - name: docker:24-dind
      alias: docker
      command: [ "--tls=false" ]
  before_script:
    # Defaults to the moving major tag; set PG_UPGRADE_BASE_TAG on the job to pin a base such
    # as "17-0.8.0", which then also becomes the pg-upgrade tag.
    - export PG_UPGRADE_BASE_TAG="${PG_UPGRADE_BASE_TAG:-$PG_MAJOR}"
    - export BUILD_ARGS="--build-arg BASE_IMAGE=postgresai/extended-postgres:${PG_UPGRADE_BASE_TAG}"
    # The image carries scripts/pg_upgrade_clone.sh, so its contents are branch-specific and the
    # tag has to be too. Publishing every branch to the bare major would let concurrent MRs
    # overwrite each other in the shared project registry, and bash-test-17 would then pull and
    # exercise some other branch's upgrade script while still reporting its own result. Only the
    # release job leaves the suffix empty and publishes the bare major.
    - export TAGS="${DOCKER_NAME}:${PG_UPGRADE_BASE_TAG}${PG_UPGRADE_TAG_SUFFIX}"
  script:
    - cd engine
    - apk update && apk upgrade && apk add --no-cache bash
    - bash ./scripts/ci_docker_build_push.sh

build-image-feature-pg-upgrade:
  <<: *build_pg_upgrade_image_definition
  <<: *only_feature
  parallel:
    matrix:
      - PG_MAJOR: [ "17", "18" ]
  variables:
    REGISTRY_USER: "${CI_REGISTRY_USER}"
    REGISTRY_PASSWORD: "${CI_REGISTRY_PASSWORD}"
    REGISTRY: "${CI_REGISTRY}"
    DOCKER_FILE: "Dockerfile.pg-upgrade"
    DOCKER_NAME: "${CI_REGISTRY}/${CI_PROJECT_NAMESPACE}/${CI_PROJECT_NAME}/pg-upgrade"
    PG_UPGRADE_TAG_SUFFIX: "-${CI_COMMIT_REF_SLUG}"

