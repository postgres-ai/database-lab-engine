# Auto-cancel redundant pipelines when new commits are pushed
workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

default:
  image: golang:1.26.7
  interruptible: true  # All jobs can be cancelled by default

stages:
  - test
  - build-binary
  - build
  - scan
  - integration-test

variables:
  # The majors the build-image-*-pg-upgrade matrices publish a pg-upgrade image for. It has to stay
  # in step with those matrices: engine/test/6.clone_upgrade.sh treats a target on this list as one
  # it must be able to upgrade into, and fails instead of skipping when the images are missing.
  PG_UPGRADE_MAJORS: "17 18"

## Conditions.
.only_engine: &only_engine
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[a-zA-Z0-9_.-]*/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - engine/**/*
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - engine/**/*

.only_dle_tag_release: &only_tag_release
  interruptible: false  # Never cancel release jobs
  rules:
   - if: $CI_COMMIT_TAG =~ /^v[0-9.]+$/

.only_dle_tag_rc: &only_tag_rc
  interruptible: false  # Never cancel RC release jobs
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9.]+[\-_]*[a-zA-Z]+[a-zA-Z0-9.\-_]*[a-zA-Z0-9]+$/

.only_dle_master: &only_master
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - engine/**/*

.only_dle_feature: &only_feature
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - engine/**/*

test:
  <<: *only_engine
  stage: test
  script:
    - cd engine
    - make test

lint:
  <<: *only_engine
  stage: test
  script:
    - cd engine
    - make lint

### Build binary.
build-binary-alpine:
  <<: *only_engine
  image: golang:1.26.7-alpine
  stage: build-binary
  artifacts:
    paths:
      - engine/bin
  script:
    - apk add --update --no-cache make git
    - cd engine
    - make build

build-binary-client-dev:
  <<: *only_feature
  stage: build-binary
  artifacts:
    paths:
      - engine/bin
  script:
    - cd engine
    - make build-client

build-binary-client-branch:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_PATH == $CI_PROJECT_PATH'
      changes:
        - engine/**/*
  stage: build-binary
  artifacts:
    paths:
      - engine/bin
  script:
    - cd engine
    - make build-client

    # Install google-cloud-cli.
    - curl -fsSL https://packages.cloud.google.com/apt/doc/apt-key.gpg | gpg --dearmor -o /usr/share/keyrings/cloud.google.gpg
    - echo "deb [signed-by=/usr/share/keyrings/cloud.google.gpg] http://packages.cloud.google.com/apt cloud-sdk main" | tee -a /etc/apt/sources.list.d/google-cloud-sdk.list
    - apt-get update && apt-get install -y google-cloud-cli

    # Authenticate.
    - GCP_KEY_FILE=$(mktemp) && trap "rm -f \"$GCP_KEY_FILE\"" EXIT && printf '%s' "${GCP_SERVICE_KEY}" > "$GCP_KEY_FILE" && gcloud auth activate-service-account --key-file="$GCP_KEY_FILE" && rm -f "$GCP_KEY_FILE"

    # Upload artifacts using MR IID to prevent cross-branch overwrites.
    - gsutil -m cp -r bin/cli/* gs://database-lab-cli/mr-${CI_MERGE_REQUEST_IID}/

build-binary-client-master:
  <<: *only_master
  stage: build-binary
  artifacts:
    paths:
      - engine/bin
  script:
    - cd engine
    - make build-client

    # Install google-cloud-cli.
    - curl -fsSL https://packages.cloud.google.com/apt/doc/apt-key.gpg | gpg --dearmor -o /usr/share/keyrings/cloud.google.gpg
    - echo "deb [signed-by=/usr/share/keyrings/cloud.google.gpg] http://packages.cloud.google.com/apt cloud-sdk main" | tee -a /etc/apt/sources.list.d/google-cloud-sdk.list
    - apt-get update && apt-get install -y google-cloud-cli

    # Authenticate.
    - GCP_KEY_FILE=$(mktemp) && trap "rm -f \"$GCP_KEY_FILE\"" EXIT && printf '%s' "${GCP_SERVICE_KEY}" > "$GCP_KEY_FILE" && gcloud auth activate-service-account --key-file="$GCP_KEY_FILE" && rm -f "$GCP_KEY_FILE"

    # Upload artifacts.
    - gsutil -m cp -r bin/cli/* gs://database-lab-cli/master/

