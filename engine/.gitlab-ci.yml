  variables:
    DOCKER_FILE: "Dockerfile.swagger-ui"
    DOCKER_IMAGE_NAME: "registry.gitlab.com/postgres-ai/database-lab/dblab-swagger-ui"
  before_script:
    - export CLEAN_TAG=$(echo ${CI_COMMIT_TAG#"v"})
    - export TAGS="${DOCKER_IMAGE_NAME}:${CLEAN_TAG}"

# Base template for bash integration tests
.bash-test-base: &bash_test_base
  stage: integration-test
  variables:
    IMAGE_TAG: "${CI_COMMIT_REF_SLUG}"
  artifacts:
    paths:
      - engine/bin
  before_script:
    - bash engine/test/_cleanup.sh
  script:
    - bash engine/test/1.synthetic.sh
    - bash engine/test/2.logical_generic.sh
    - bash engine/test/4.physical_basebackup.sh
    # Runs the upgrade for a POSTGRES_VERSION whose next major is in PG_UPGRADE_MAJORS and reports a
    # skip for the rest; either way it prints an UPGRADE_TEST_RESULT line naming the version pair.
    # The marker is asserted rather than merely printed when the job is one that must upgrade, so
    # coverage cannot quietly disappear behind a passing pipeline.
    - |
      # pipefail so that tee cannot mask a failing test run - the exact way a green pipeline
      # comes to claim coverage it never produced.
      set -o pipefail
      bash engine/test/6.clone_upgrade.sh 2>&1 | tee upgrade_test.log
    - |
      if [ "${UPGRADE_TEST_REQUIRED}" = "true" ] && ! grep -q "UPGRADE_TEST_RESULT: executed" upgrade_test.log; then
        echo "ERROR: this job must run a clone upgrade, but no UPGRADE_TEST_RESULT: executed was reported" >&2
        exit 1
      fi
  after_script:
    - bash engine/test/_cleanup.sh
  tags:
    - dle-test

# MR pipelines: Only run PG 17 and PG 18 to reduce queue time
# (10 jobs competing for 2 runners was causing 35+ min queue times)
.bash-test-mr: &bash_test_mr
  <<: *bash_test_base
  rules:
    - if: '$CI_PROJECT_NAMESPACE != "postgres-ai"'
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - engine/**/*

# Main branch: Run full test matrix for comprehensive coverage
.bash-test-main: &bash_test_main
  <<: *bash_test_base
  rules:
    - if: '$CI_PROJECT_NAMESPACE != "postgres-ai"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - engine/**/*

# MR jobs - only PG 17 and PG 18 (latest stable versions)
bash-test-17:
  <<: *bash_test_mr
  variables:
    POSTGRES_VERSION: 17
    # 17 -> 18 is the pair this pipeline publishes both images for, so this job has to run the
    # clone upgrade; 6.clone_upgrade.sh fails instead of skipping when it cannot.
    UPGRADE_TEST_REQUIRED: "true"

bash-test-18:
  <<: *bash_test_mr
  variables:
    POSTGRES_VERSION: 18

# Main branch jobs - full matrix (all PostgreSQL versions)
bash-test-main-10:
  <<: *bash_test_main
  variables:
    POSTGRES_VERSION: 10

bash-test-main-11:
  <<: *bash_test_main
  variables:
    POSTGRES_VERSION: 11

bash-test-main-12:
  <<: *bash_test_main
  variables:
    POSTGRES_VERSION: 12

bash-test-main-13:
  <<: *bash_test_main
  variables:
    POSTGRES_VERSION: 13

bash-test-main-14:
  <<: *bash_test_main
  variables:
    POSTGRES_VERSION: 14

bash-test-main-15:
  <<: *bash_test_main
  variables:
    POSTGRES_VERSION: 15

bash-test-main-16:
  <<: *bash_test_main
  variables:
    POSTGRES_VERSION: 16

bash-test-main-17:
  <<: *bash_test_main
  variables:
    POSTGRES_VERSION: 17
    UPGRADE_TEST_REQUIRED: "true"

bash-test-main-18:
  <<: *bash_test_main
  variables:
    POSTGRES_VERSION: 18

integration-test:
  services:
    - name: docker:24-dind
      alias: docker
      command: [ "--tls=false" ]
  <<: *only_feature
  stage: integration-test
  retry:
    max: 2
    when: script_failure
  variables:
    # Instruct Testcontainers to use the daemon of DinD.
    # DOCKER_HOST: "tcp://docker:2375"
    # Instruct Docker not to start over TLS.
    DOCKER_TLS_CERTDIR: ""
    # Improve performance with overlayfs.
    DOCKER_DRIVER: overlay2
    # Maximum supported API version is 1.41 for the current image
    DOCKER_API_VERSION: "1.41"
    # The clone upgrade tests run pg_upgrade in this image. The build stage precedes this one and
    # publishes it under the target major's ref-scoped tag; the tests authenticate with
    # CI_REGISTRY_USER and CI_REGISTRY_PASSWORD. This is the Go integration suite only - the bash
    # suite reads PG_UPGRADE_IMAGE, which it derives per job.
    #
    # These tests read a clone directory that containers write, so they need a daemon that shares
    # this job's filesystem. The docker:dind service below does not provide that, so the upgrade
    # tests currently SKIP here rather than run - `make test-ci-integration` passes -v so the trace
    # says so plainly. Moving this job to a runner whose daemon is local (the dle-test shell
    # runners are) and setting DBLAB_UPGRADE_TESTS_REQUIRED: "true" turns those skips into
    # failures and makes the coverage real; until then this job does not exercise pg_upgrade.
    DBLAB_PG_UPGRADE_IMAGE: "${CI_REGISTRY}/${CI_PROJECT_NAMESPACE}/${CI_PROJECT_NAME}/pg-upgrade:17-${CI_COMMIT_REF_SLUG}"
  script:
    - cd engine
    - make test-ci-integration
  tags:
    # The suite reaches the daemon over unix:///var/run/docker.sock, which only the hetzner docker
    # runners bind-mount - the dind service above is not reachable that way, and DOCKER_HOST stays
    # commented out above for the filesystem-sharing reason already noted. Instance runners expose
    # no such socket, so every test that starts a container fails there. Both tags are required so
    # this lands on hetzner-gitlab-runner-01/02 and not on the dle-test shell runners.
    - hetzner-runner
    - docker
