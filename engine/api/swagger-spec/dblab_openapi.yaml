# OpenAPI spec for DBLab API
# Useful links:
# - validate and test: https://editor.swagger.io/
# - official reference location for this API: https://dblab.readme.io/
# - GitHub (give us a ⭐️): https://github.com/postgres-ai/database-lab-engine

openapi: 3.0.1
info:
  title: DBLab API
  description: This page provides the OpenAPI specification for the Database Lab (DBLab)
    API, previously recognized as the DLE API (Database Lab Engine API).
  contact:
    name: DBLab API Support
    url: https://postgres.ai/contact
    email: api@postgres.ai
  license:
    name: Apache 2.0
    url: https://github.com/postgres-ai/database-lab-engine/blob/dle-4-0/LICENSE
  version: 4.1.0
externalDocs:
  description: DBLab Docs
  url: https://postgres.ai/docs/database-lab

servers:
  - url: "https://demo.dblab.dev/api"
    description: "DBLab demo server (with DB branching support); token: 'demo-token'"
    x-examples:
      Verification-Token: "demo-token"
  - url: "https://demo.aws.postgres.ai:446/api"
    description: "DBLab 3.x demo server; token: 'demo-token'"
    x-examples:
      Verification-Token: "demo-token"
  - url: "{scheme}://{host}:{port}/{basePath}"
    description: "Any DBLab accessed locally / through SSH port forwarding"
    variables:
      scheme:
        enum:
          - "https"
          - "http"
        default: "http"
        description: "'http' for local connections and SSH port forwarding;
          'https' for everything else."
      host:
        default: "localhost"
        description: "where DBLab server is installed. Use 'localhost' to work locally
          or when SSH port forwarding is used."
      port:
        default: "2346"
        description: "Port to access DBLab UI or API. Originally, '2345' is used for
          direct work with API and '2346' – with UI. However, with UI, API is also available,
          at ':2346/api'."
      basePath:
        default: "api"
        description: "basePath value to access API. Use empty when working with API port
          (2345 by default), or '/api' when working with UI port ('2346' by default)."
    x-examples:
      Verification-Token: "custom_example_token"

tags:
- name: DBLab
  description: "DBLab API Reference – database branching, instant cloning, and more.
    DBLab CLI and UI rely on DBLab API."
  externalDocs:
    description: "DBLab Docs - tutorials, howtos, references."
    url: https://postgres.ai/docs/reference-guides/database-lab-engine-api-reference

paths:
  /status:
    get:
      tags:
      - Instance
      summary: DBLab instance status and detailed information
      description: "Retrieves detailed information about the DBLab instance: status, version,
        clones, snapshots, etc."
      operationId: status
      parameters:
      - name: Verification-Token
        in: header
        required: true
        schema:
          type: string
      responses:
        200:
          description: Returned detailed information about the DBLab instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instance'
              example:
                status:
                  code: OK
                  message: Instance is ready
                engine:
                  version: v4.0.0-alpha.5-20230516-0224
                  edition: standard
                  billingActive: true
                  instanceID: chhfqfcnvrvc73d0lij0
                  startedAt: '2023-05-16T03:50:19Z'
                  telemetry: true
                  disableConfigModification: false
                pools:
                - name: dblab_pool/dataset_1
                  mode: zfs
                  dataStateAt: ''
                  status: empty
                  cloneList: []
                  fileSystem:
                    mode: zfs
                    size: 30685528064
                    free: 30685282816
                    used: 245248
                    dataSize: 12288
                    usedBySnapshots: 0
                    usedByClones: 219648
                    compressRatio: 1
                - name: dblab_pool/dataset_2
                  mode: zfs
                  dataStateAt: ''
                  status: empty
                  cloneList: []
                  fileSystem:
                    mode: zfs
                    size: 30685528064
                    free: 30685282816
                    used: 245248
                    dataSize: 12288
                    usedBySnapshots: 0
                    usedByClones: 219648
                    compressRatio: 1
                - name: dblab_pool/dataset_3
                  mode: zfs
                  dataStateAt: ''
                  status: empty
                  cloneList: []
                  fileSystem:
                    mode: zfs
                    size: 30685528064
                    free: 30685282816
                    used: 245248
                    dataSize: 12288
                    usedBySnapshots: 0
                    usedByClones: 219648
                    compressRatio: 1
                cloning:
                  expectedCloningTime: 0
                  numClones: 0
                  clones: []
                retrieving:
                  mode: logical
                  status: pending
                  lastRefresh:
                  nextRefresh:
                  alerts: {}
                  activity:
                provisioner:
                  dockerImage: postgresai/extended-postgres:15
                  containerConfig:
                    shm-size: 1gb
                synchronization:
                  status:
                    code: Not available
                    message: ''
                  lastReplayedLsn: ''
                  lastReplayedLsnAt: ''
                  replicationLag: 0
                  replicationUptime: 0
        401:
          description: Unauthorized access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "UNAUTHORIZED"
                message: "Check your verification token."
  /snapshots:
    get:
      tags:
      - Snapshots
      summary: List all snapshots
      description: Return a list of all available snapshots.
      operationId: snapshots
      parameters:
      - name: Verification-Token
        in: header
        required: true
        schema:
          type: string
      - name: branch
        in: query
        required: false
        description: Return only the snapshots of this branch.
        schema:
          type: string
      - name: dataset
        in: query
        required: false
        description: Return only the snapshots of this pool (dataset). Together with 'branch', selects the pool the branch is looked up in.
        schema:
          type: string
      responses:
        200:
          description: Returned a list of snapshots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Snapshot'
              example:
                - id: dblab_pool/dataset_2/nik-test-branch/20230509212711@20230509212711
                  createdAt: '2023-05-09T21:27:11Z'
                  dataStateAt: '2023-05-09T21:27:11Z'
                  physicalSize: 0
                  logicalSize: 11518021632
                  pool: dblab_pool/dataset_2
                  numClones: 1
                - id: dblab_pool/dataset_2/nik-test-branch/20230307171959@20230307171959
                  createdAt: '2023-03-07T17:19:59Z'
                  dataStateAt: '2023-03-07T17:19:59Z'
                  physicalSize: 151552
                  logicalSize: 11518015488
                  pool: dblab_pool/dataset_2
                  numClones: 1
        400:
          description: Bad request, for example an unknown branch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
          description: Unauthorized access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "UNAUTHORIZED"
                message: "Check your verification token."
  /full-refresh:
    post:
      tags:
        - Instance
      summary: Trigger full data refresh
      description: "Initiates a full data refresh."
      operationId: refresh
      parameters:
        - name: Verification-Token
          in: header
          required: true
          schema:
            type: string
      responses:
        200:
          description: Full refresh has been initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FullRefresh'
              example:
                status: OK
                message: Full refresh started
        400:
          description: "Bad request: a refresh is already in progress, retrieval is pending, or no pool is available"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
          description: Unauthorized access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "UNAUTHORIZED"
                message: "Check your verification token."
  /snapshot:
    post:
      tags:
        - Snapshots
      summary: Create a snapshot
      description: "Create a new snapshot from the current state of the selected pool.
        This snapshot can later be used to create clones or new branches."
      operationId: createSnapshot
      parameters:
        - name: Verification-Token
          in: header
          required: true
          schema:
            type: string
      requestBody:
        description: "Optional parameters for snapshot creation.
          If no pool name is provided, the first available pool is used."
        content:
          application/json:
            schema:
              type: object
              properties:
                poolName:
                  type: string
                  description: Name of the pool to create snapshot in.
        required: false
      responses:
        200:
          description: Created snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedSnapshot'
        400:
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
          description: Unauthorized access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "UNAUTHORIZED"
                message: "Check your verification token."
      x-codegen-request-body-name: body
  /snapshot/{id}:
    get:
      tags:
        - Snapshots
      summary: Retrieve a snapshot
      description: "Retrieves the information for the specified snapshot. Pass the snapshot ID as is,
        without percent-encoding '/' and '@'."
      operationId: getSnapshot
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the snapshot.
          schema:
            type: string
            pattern: '.*'
        - name: Verification-Token
          in: header
          required: true
          schema:
            type: string
      responses:
        200:
          description: Returned the specified snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snapshot'
        400:
          description: "Bad request: empty or unknown snapshot ID"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: BAD_REQUEST
                message: no snapshot found
        401:
          description: Unauthorized access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "UNAUTHORIZED"
                message: "Check your verification token."
    delete:
      tags:
        - Snapshots
      summary: Delete a snapshot
      description: "Permanently delete the specified snapshot.
        If the snapshot has dependent clones or datasets, `force=true` can be provided as a query parameter.
        Deletion of a protected snapshot returns 400; remove protection via PATCH first.
        Dependent protected clones block deletion even with `force=true`."
      operationId: deleteSnapshot
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the snapshot to delete.
          schema:
            type: string
            pattern: '.*'
        - name: force
          in: query
          required: false
          description: Force deletion even if dependent clones or datasets exist.
          schema:
            type: boolean
        - name: Verification-Token
          in: header
          required: true
          schema:
            type: string
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseStatus'
        400:
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
          description: Unauthorized access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "UNAUTHORIZED"
                message: "Check your verification token."
    patch:
      tags:
        - Snapshots
      summary: Update a snapshot
      description: "Update deletion protection or scheduled deletion of the specified snapshot.
        Protection and scheduled deletion are mutually exclusive: enabling protection clears any
        scheduled deletion, and scheduling deletion clears protection."
      operationId: updateSnapshot
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the snapshot to update.
          schema:
            type: string
            pattern: '.*'
        - name: Verification-Token
          in: header
          required: true
          schema:
            type: string
      requestBody:
        description: Snapshot protection settings
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSnapshot'
        required: true
      responses:
        200:
          description: Successfully updated the specified snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snapshot'
        400:
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
          description: Unauthorized access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /snapshot/clone:
    post:
      tags:
        - Snapshots
      summary: Create a snapshot from a clone
      description: "Create a new snapshot from the current state of the specified clone and return it.
        Unlike POST /branch/snapshot, this does not move any branch head."
      operationId: createSnapshotFromClone
      parameters:
        - name: Verification-Token
          in: header
          required: true
          schema:
            type: string
      requestBody:
        description: Clone to snapshot
        content:
          application/json:
            schema:
              type: object
              required:
                - cloneID
              properties:
                cloneID:
                  type: string
                  description: The ID of the clone to snapshot.
        required: true
      responses:
        200:
          description: Created snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snapshot'
        400:
          description: "Bad request: invalid body, empty or unknown 'cloneID', the clone is being upgraded,
            or the snapshot could not be created"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
          description: Unauthorized access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "UNAUTHORIZED"
                message: "Check your verification token."
      x-codegen-request-body-name: body
  /clones:
    get:
      tags:
      - Clones
      summary: List all clones
      description: Return a list of all available clones (database endpoints).
      operationId: listClones
      parameters:
      - name: Verification-Token
        in: header
        required: true
        schema:
          type: string
      responses:
        200:
          description: Returned a list of all available clones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Clone'
              example:
                - id: test-clone-2
                  snapshot:
                    id: dblab_pool/dataset_2/nik-test-branch/20230509212711@20230509212711
                    createdAt: '2023-05-09T21:27:11Z'
                    dataStateAt: '2023-05-09T21:27:11Z'
                    physicalSize: 120832
                    logicalSize: 11518021632
                    pool: dblab_pool/dataset_2
                    numClones: 3
                  branch: ''
                  protected: false
                  deleteAt:
                  createdAt: '2023-05-16T06:12:52Z'
                  status:
                    code: OK
                    message: Clone is ready to accept Postgres connections.
                  db:
                    connStr: host=branching.aws.postgres.ai port=6005 user=tester dbname=postgres
                    host: branching.aws.postgres.ai
                    port: '6005'
                    username: tester
                    password: ''
                    dbName: postgres
                  metadata:
                    cloneDiffSize: 484352
                    logicalSize: 11518029312
                    cloningTime: 1.5250661829999999
                    maxIdleMinutes: 120
                - id: test-clone
                  snapshot:
                    id: dblab_pool/dataset_2/nik-test-branch/20230509212711@20230509212711
                    createdAt: '2023-05-09T21:27:11Z'
                    dataStateAt: '2023-05-09T21:27:11Z'
                    physicalSize: 120832
                    logicalSize: 11518021632
                    pool: dblab_pool/dataset_2
                    numClones: 3
                  branch: ''
                  protected: false
                  deleteAt:
                  createdAt: '2023-05-16T06:12:30Z'
                  status:
                    code: OK
                    message: Clone is ready to accept Postgres connections.
                  db:
                    connStr: host=branching.aws.postgres.ai port=6004 user=tester dbname=postgres
                    host: branching.aws.postgres.ai
                    port: '6004'
                    username: tester
                    password: ''
                    dbName: postgres
                  metadata:
                    cloneDiffSize: 486400
                    logicalSize: 11518030336
                    cloningTime: 1.57552338
                    maxIdleMinutes: 120
        401:
          description: Unauthorized access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "UNAUTHORIZED"
                message: "Check your verification token."
  /clone:
    post:
      tags:
      - Clones
      summary: Create a clone
      operationId: createClone
      parameters:
      - name: Verification-Token
        in: header
        required: true
        schema:
          type: string
      requestBody:
        description: Clone object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClone'
        required: true
      responses:
        201:
          description: Created a new clone
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Clone'
              example:
                id: test-clone-2
                snapshot:
                  id: dblab_pool/dataset_2/nik-test-branch/20230509212711@20230509212711
                  createdAt: '2023-05-09T21:27:11Z'
                  dataStateAt: '2023-05-09T21:27:11Z'
                  physicalSize: 120832
                  logicalSize: 11518021632
                  pool: dblab_pool/dataset_2
                  numClones: 3
                branch: ''
                protected: false
                deleteAt:
                createdAt: '2023-05-16T06:12:52Z'
                status:
                  code: CREATING
                  message: Clone is being created.
                db:
                  connStr: ''
                  host: ''
                  port: ''
                  username: tester
                  password: ''
                  dbName: postgres
                metadata:
                  cloneDiffSize: 0
                  logicalSize: 0
                  cloningTime: 0
                  maxIdleMinutes: 0
        400:
          description: Returned an error caused by invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "BAD_REQUEST"
                message: "clone with such ID already exists"
        401:
          description: Unauthorized access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "UNAUTHORIZED"
                message: "Check your verification token."
      x-codegen-request-body-name: body
  /clone/{id}:
    get:
      tags:
      - Clones
      summary: Retrieve a clone
      description: Retrieves the information for the specified clone.
      operationId: getClone
      parameters:
      - name: Verification-Token
        in: header
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: Clone ID
        required: true
        schema:
          type: string
      responses:
        200:
          description: Returned detailed information for the specified clone
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Clone'
              example:
                id: test-clone
                snapshot:
                  id: dblab_pool/dataset_2/nik-test-branch/20230509212711@20230509212711
                  createdAt: '2023-05-09T21:27:11Z'
                  dataStateAt: '2023-05-09T21:27:11Z'
                  physicalSize: 120832
                  logicalSize: 11518021632
                  pool: dblab_pool/dataset_2
                  numClones: 3
                branch: ''
                protected: false
                deleteAt:
                createdAt: '2023-05-16T06:12:30Z'
                status:
                  code: OK
                  message: Clone is ready to accept Postgres connections.
                db:
                  connStr: host=branching.aws.postgres.ai port=6004 user=tester dbname=postgres
                  host: branching.aws.postgres.ai
                  port: '6004'
                  username: tester
                  password: ''
                  dbName: postgres
                metadata:
                  cloneDiffSize: 486400
                  logicalSize: 11518030336
                  cloningTime: 1.57552338
                  maxIdleMinutes: 120
        401:
          description: Unauthorized access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "UNAUTHORIZED"
                message: "Check your verification token."
        404:
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: NOT_FOUND
                message: Requested object does not exist. Specify your request.
    delete:
      tags:
      - Clones
      summary: Delete a clone
      description: Permanently delete the specified clone. It cannot be undone.
      operationId: deleteClone
      parameters:
      - name: Verification-Token
        in: header
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: Clone ID
        required: true
        schema:
          type: string
      responses:
        200:
          description: Successfully deleted the specified clone. The response has no body.
        401:
          description: Unauthorized access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "UNAUTHORIZED"
                message: "Check your verification token."
        404:
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: NOT_FOUND
                message: Requested object does not exist. Specify your request.
    patch:
      tags:
      - Clones
      summary: Update a clone
      description: "Updates the specified clone by setting the values of the parameters passed.
        Currently, only deletion protection can be changed: 'protected' and 'protectionDurationMinutes'."
      operationId: updateClone
      parameters:
      - name: Verification-Token
        in: header
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: Clone ID
        required: true
        schema:
          type: string
      requestBody:
        description: Clone object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateClone'
        required: true
      responses:
        200:
          description: Successfully updated the specified clone
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Clone'
              example:
                id: test-clone-2
                snapshot:
                  id: dblab_pool/dataset_2/nik-test-branch/20230509212711@20230509212711
                  createdAt: '2023-05-09T21:27:11Z'
                  dataStateAt: '2023-05-09T21:27:11Z'
                  physicalSize: 120832
                  logicalSize: 11518021632
                  pool: dblab_pool/dataset_2
                  numClones: 2
                branch: ''
                protected: true
                deleteAt:
                createdAt: '2023-05-16T06:12:52Z'
                status:
                  code: OK
                  message: Clone is ready to accept Postgres connections.
                db:
                  connStr: host=branching.aws.postgres.ai port=6005 user=tester dbname=postgres
                  host: branching.aws.postgres.ai
                  port: '6005'
                  username: tester
                  password: ''
                  dbName: postgres
                metadata:
                  cloneDiffSize: 561664
                  logicalSize: 11518030336
                  cloningTime: 1.5250661829999999
                  maxIdleMinutes: 120
        400:
          description: "Bad request: the request body cannot be parsed"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
          description: Unauthorized access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "UNAUTHORIZED"
                message: "Check your verification token."
        #404:  # TODO: fix it in engine (currently returns 500)
        #  description: Not found
        #  content:
        #    application/json:
        #      schema:
        #        $ref: '#/components/schemas/Error'
        #      example:
        #        code: NOT_FOUND
        #        message: Requested object does not exist. Specify your request.
      x-codegen-request-body-name: body
  /clone/{id}/reset:
    post:
      tags:
      - Clones
      summary: Reset a clone
      description: "Reset the specified clone to a previously stored state.
        This can be done by specifying a particular snapshot ID or using the 'latest' flag.
        All changes made after the snapshot are discarded during the reset, unless those
        changes were preserved in a snapshot. All database connections will be reset,
        requiring users and applications to reconnect. The duration of the reset operation
        is comparable to the creation of a new clone. However, unlike creating a new clone,
        the reset operation retains the database credentials and does not change the port.
        Consequently, users and applications can continue to use the same database credentials
        post-reset, though reconnection will be necessary. Please note that any unsaved changes
        will be irretrievably lost during this operation, so ensure necessary data is backed up
        in a snapshot prior to resetting the clone."
      operationId: resetClone
      parameters:
      - name: Verification-Token
        in: header
        required: true
        schema:
