  /clone/{id}/upgrade:
    post:
      tags:
      - Clones
      summary: Upgrade a clone to a newer PostgreSQL major version
      description: "Upgrade the specified clone in place to a newer PostgreSQL major version.
        The clone's Postgres is shut down, pg_upgrade converts the data directory in link mode,
        and the clone restarts on an image of the target major. Data is not copied, so the
        operation is fast and consumes almost no extra space. The request returns as soon as the
        clone enters the UPGRADING state; watch the clone status for the result.
        On success the status returns to OK and dbVersion reports the new major.
        If the upgrade fails before any data is converted, the clone is restarted on its original
        version and the status becomes WARNING with nothing lost. If it fails after conversion
        began, the old cluster can no longer be trusted, so the clone is re-created from its
        origin snapshot and the status becomes WARNING - data written since the clone was created
        is lost in that case. If the clone container itself fails to come back up, the status also
        becomes WARNING and the clone stops accepting connections, but its data directory is kept
        and the next engine start finishes or undoes the upgrade. A single run is bounded by
        provision.pgUpgradeTimeout, three hours by default.
        Resetting the clone always returns it to the engine default version.
        The target major is not a request parameter: it follows from provision.pgUpgradeImage,
        which is built on that major's binaries, and is reported by GET /status as
        cloneUpgrade.targetVersion. Requires provision.pgUpgradeImage to be configured on the
        instance."
      operationId: upgradeClone
      parameters:
      - in: header
        name: Verification-Token
        schema:
          type: string
        required: true
      - in: path
        required: true
        name: id
        schema:
          type: string
        description: Clone ID
      requestBody:
        description: Upgrade object
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpgradeClone'
      responses:
        200:
          description: Upgrade of the specified clone has started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloneUpgradePlan'
        400:
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
          description: Unauthorized access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        500:
          description: The upgrade cannot be started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /observation/start:
    post:
      tags:
      - Observation
      summary: Start observing
      description: "[EXPERIMENTAL] Start an observation session for the specified clone.
        Observation sessions help detect dangerous (long-lasting, exclusive) locks in CI/CD pipelines.
        One of common scenarios is using observation sessions to test schema changes (DB migrations)."
      operationId: startObservation
      parameters:
      - name: Verification-Token
        in: header
        required: true
        schema:
          type: string
      requestBody:
        description: Start observation object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartObservationRequest'
        required: true
      responses:
        200:
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservationSession'
        400:
          description: "Bad request: the Platform client is not configured, the body is invalid,
            or the session cannot be started on the Platform"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
          description: Unauthorized access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "UNAUTHORIZED"
                message: "Check your verification token."
        404:
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: NOT_FOUND
                message: Requested object does not exist. Specify your request.
      x-codegen-request-body-name: body
  /observation/stop:
    post:
      tags:
      - Observation
      summary: Stop observing
      description: "[EXPERIMENTAL] Stop the previously started observation session."
      operationId: stopObservation
      parameters:
      - name: Verification-Token
        in: header
        required: true
        schema:
          type: string
      requestBody:
        description: Stop observation object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StopObservationRequest'
        required: true
      responses:
        200:
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservationSession'
        400:
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
          description: Unauthorized access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "UNAUTHORIZED"
                message: "Check your verification token."
        404:
          description: The clone does not exist or is not under observation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-codegen-request-body-name: body
  /observation/summary/{clone_id}/{session_id}:
    get:
      tags:
      - Observation
      summary: Get observation summary
      description: "[EXPERIMENTAL] Collect the observation summary info."
      operationId: summaryObservation
      parameters:
      - name: Verification-Token
        in: header
        required: true
        schema:
          type: string
      - name: clone_id
        in: path
        description: Clone ID
        required: true
        schema:
          type: string
      - name: session_id
        in: path
        description: Session ID
        required: true
        schema:
          type: integer
          format: int64
      responses:
        200:
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservationSummaryArtifact'
        400:
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
          description: Unauthorized access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "UNAUTHORIZED"
                message: "Check your verification token."
        404:
          description: The clone is not under observation or the session is unknown
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /observation/download:
    get:
      tags:
      - Observation
      summary: Download an observation artifact
      description: "[EXPERIMENTAL] Download an artifact for the specified clone and observation session."
      operationId: downloadObservationArtifact
      parameters:
      - name: Verification-Token
        in: header
        required: true
        schema:
          type: string
      - name: artifact_type
        in: query
        description: Type of the requested artifact
        required: true
        schema:
          type: string
          enum:
          - pg_stat_statements
          - pg_stat_user_tables
          - pg_stat_database
          - pg_stat_bgwriter
          - pg_stat_kcache
          - pg_stat_all_indexes
          - pg_stat_all_tables
          - pg_statio_all_indexes
          - pg_statio_all_tables
          - pg_statio_all_sequences
          - pg_stat_user_functions
          - pg_stat_slru
          - objects_size
          - log_errors
      - name: clone_id
        in: query
        description: Clone ID
        required: true
        schema:
          type: string
      - name: session_id
        in: query
        description: Session ID
        required: true
        schema:
          type: integer
          format: int64
      responses:
        200:
          description: The artifact file
          content:
            application/json:
              schema:
                type: object
        400:
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
          description: Unauthorized access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "UNAUTHORIZED"
                message: "Check your verification token."
        404:
          description: The clone is not under observation or the artifact is not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Instance:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/Status'
        engine:
          $ref: '#/components/schemas/Engine'
        pools:
          type: array
          items:
            $ref: '#/components/schemas/PoolEntry'
        cloning:
          $ref: '#/components/schemas/Cloning'
        retrieving:
          $ref: '#/components/schemas/Retrieving'
        provisioner:
          $ref: '#/components/schemas/Provisioner'
        synchronization:
          $ref: '#/components/schemas/Synchronization'
        cloneUpgrade:
          $ref: '#/components/schemas/CloneUpgrade'
    Status:
      required:
      - code
      - message
      type: object
      properties:
        code:
          type: string
          description: Status code
        message:
          type: string
          description: Status description
    Engine:
      type: object
      properties:
        version:
          type: string
        edition:
          type: string
        billingActive:
          type: boolean
        instanceID:
          type: string
        startedAt:
          type: string
          format: date-time
        telemetry:
          type: boolean
        disableConfigModification:
          type: boolean
    PoolEntry:
      type: object
      properties:
        name:
          type: string
        mode:
          type: string
        dataStateAt:
          type: string
          format: date-time
        status:
          type: string
        cloneList:
          type: array
          items:
            type: string
        fileSystem:
          $ref: '#/components/schemas/FileSystem'
    FileSystem:
      type: object
      properties:
        mode:
          type: string
        free:
          type: integer
          format: int64
        size:
          type: integer
          format: int64
        used:
          type: integer
          format: int64
        dataSize:
          type: integer
          format: int64
        usedBySnapshots:
          type: integer
          format: int64
        usedByClones:
          type: integer
          format: int64
        compressRatio:
          type: number
          format: double
    Cloning:
      type: object
      properties:
        expectedCloningTime:
          type: number
          format: double
        numClones:
          type: integer
          format: int64
        clones:
          type: array
          items:
            $ref: '#/components/schemas/Clone'
        protectionLeaseDurationMinutes:
          type: integer
          format: int64
          minimum: 0
          description: Default protection lease duration in minutes
        protectionMaxDurationMinutes:
          type: integer
          format: int64
          minimum: 0
          description: Maximum allowed protection duration in minutes
    Retrieving:
      type: object
      properties:
        mode:
          type: string
        status:
          type: string
        lastRefresh:
          type: string
          format: date-time
          nullable: true
        nextRefresh:
          type: string
          format: date-time
          nullable: true
        alerts:
          type: object
          description: Active alerts keyed by alert type, for example 'refresh_failed' or 'refresh_skipped'
          additionalProperties:
            $ref: '#/components/schemas/Alert'
        activity:
          type: object
          nullable: true
          allOf:
          - $ref: '#/components/schemas/Activity'
    Alert:
      type: object
      properties:
        level:
          type: string
          enum:
          - error
          - warning
          - unknown
        message:
          type: string
        lastSeen:
          type: string
          format: date-time
        count:
          type: integer
    Activity:
      type: object
      properties:
        source:
          type: array
          items:
            $ref: '#/components/schemas/PGActivityEvent'
        target:
          type: array
          items:
            $ref: '#/components/schemas/PGActivityEvent'
    PGActivityEvent:
      type: object
      properties:
        user:
          type: string
        query:
          type: string
        duration:
          type: number
        waitEventType:
          type: string
        waitEvent:
          type: string
    Provisioner:
      type: object
      properties:
        dockerImage:
          type: string
        containerConfig:
          type: object
          additionalProperties: true
    Synchronization:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/Status'
        startedAt:
          type: string
          format: date-time
        lastReplayedLsn:
          type: string
        lastReplayedLsnAt:
          type: string
          format: date-time
        replicationLag:
          type: integer
        replicationUptime:
          type: integer
    Snapshot:
      type: object
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        dataStateAt:
          type: string
          format: date-time
        physicalSize:
          type: integer
          format: int64
        logicalSize:
          type: integer
          format: int64
        pool:
          type: string
        numClones:
          type: integer
          format: int
        clones:
          type: array
          description: IDs of the clones created from the snapshot
          items:
            type: string
        branch:
          type: string
        message:
          type: string
        protected:
          type: boolean
          description: Whether the snapshot is protected from deletion (manual, retention, and auto-deletion).
        protectedTill:
          type: string
          format: date-time
          description: Time until which the snapshot is protected; omitted means indefinite when protected, or none.
        deleteAt:
          type: string
          format: date-time
          description: Scheduled auto-deletion time; omitted means none. Mutually exclusive with protection.
    Database:
      type: object
      properties:
        connStr:
          type: string
        host:
          type: string
        port:
          type: string
        username:
          type: string
        password:
          type: string
        dbName:
          type: string
        ownerUser:
          type: string
          description: Authenticated user the clone is bound to, when clone-to-user binding is enabled
    Clone:
      type: object
      properties:
        id:
          type: string
        snapshot:
          $ref: '#/components/schemas/Snapshot'
        branch:
          type: string
        revision:
          type: integer
        protected:
          type: boolean
          default: false
        protectedTill:
          type: string
          format: date-time
          description: Time when the protection lease expires
        deleteAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/Status'
        dockerImage:
          type: string
          description: Per-clone image override, set by a major upgrade and cleared by a reset. Empty means the clone runs the engine-wide image
        dbVersion:
          type: string
          description: PostgreSQL major version the clone is currently running
        db:
          $ref: '#/components/schemas/Database'
        metadata:
          $ref: '#/components/schemas/CloneMetadata'
    CloneMetadata:
      type: object
      properties:
        cloneDiffSize:
          type: integer
          format: int64
        logicalSize:
          type: integer
          format: int64
        cloningTime:
          type: number
          format: double
        maxIdleMinutes:
          type: integer
          format: int64
        protectionLeaseDurationMinutes:
          type: integer
          format: int64
          minimum: 0
          description: Protection lease duration in minutes
        protectionMaxDurationMinutes:
          type: integer
          format: int64
          minimum: 0
          description: Maximum allowed protection duration in minutes
    CreateClone:
      type: object
      required:
      - db
      properties:
        id:
          type: string
        snapshot:
          type: object
          properties:
            id:
              type: string
        branch:
          type: string
        protected:
          type: boolean
          default:
        protectionDurationMinutes:
          type: integer
          format: int64
          minimum: 0
          description: Protection duration in minutes. 0 means forever, omit for default duration.
        db:
          type: object
          required:
          - username
          - password
          properties:
            username:
              type: string
            password:
              type: string
            restricted:
              type: boolean
              default:
            db_name:
              type: string
        extra_conf:
          type: object
          description: Extra PostgreSQL configuration parameters for the clone
          additionalProperties:
            type: string
    ResetClone:
      type: object
      properties:
        snapshotID:
          type: string
        latest:
          type: boolean
          default: false
      description: "Define what snapshot needs to be used when resetting the clone.
       'snapshotID' allows specifying the exact snapshot, while 'latest' allows using 
       the latest snapshot among all available snapshots. The latter method can be 
       helpful when the exact snapshot ID is not known."
    UpgradeClone:
      type: object
      description: "Object defining how a clone is upgraded. The target version is not part of it: it follows from provision.pgUpgradeImage and is reported by GET /status as cloneUpgrade.targetVersion"
      properties:
        dockerImage:
          type: string
          description: Image the upgraded clone runs. When omitted, the engine substitutes the major in the clone's current image tag and keeps every other tag component. When its tag names a major, that major has to be the one the instance upgrades to
          example: postgresai/extended-postgres:17-0.8.0

    CloneUpgradePlan:
      type: object
      description: What an accepted upgrade request will do
      properties:
        targetVersion:
          type: integer
          description: PostgreSQL major version the clone is being upgraded to
          example: 17
        dockerImage:
          type: string
          description: Image the upgraded clone runs
          example: postgresai/extended-postgres:17-0.8.0

    CloneUpgrade:
      type: object
      description: The clone major upgrade action on this instance. Available folds in everything the upgrade endpoint checks before accepting a request, so a client that hides the action when it is false never offers one that would fail
      properties:
        available:
          type: boolean
          description: Whether a clone upgrade can be requested on this instance
          example: true
        targetVersion:
          type: integer
          description: PostgreSQL major version clones are upgraded to. Derived from provision.pgUpgradeImage; absent when the upgrade is unavailable
          example: 17
        reason:
          type: string
          description: Why the upgrade is unavailable. Always an instance configuration matter, never a property of a particular clone
          example: clone upgrade is not configured on this instance; set provision.pgUpgradeImage

    UpdateClone:
      type: object
      properties:
        protected:
          type: boolean
          default: false
        protectionDurationMinutes:
          type: integer
          format: int64
          minimum: 0
          description: Protection duration in minutes. 0 means forever, omit for default duration.
    UpdateSnapshot:
      type: object
      description: "Protection update for a snapshot. Set 'protected' to toggle protection (optionally timed via
        'protectionDurationMinutes'), or 'deleteAt' to schedule deletion. The two are mutually exclusive."
      properties:
        protected:
          type: boolean
          description: Enable or disable deletion protection. Omit to leave unchanged.
        protectionDurationMinutes:
          type: integer
          format: int64
          minimum: 0
          description: Protection duration in minutes. 0 or omitted means indefinite, unless the server's protectionMaxDurationMinutes cap is set, in which case it is limited to that many minutes.
        deleteAt:
          type: string
          format: date-time
          description: Schedule deletion at this time. Clears protection. Mutually exclusive with 'protected'.
    UpdateBranch:
      type: object
      description: "Protection update for a branch. Set 'protected' to toggle protection (optionally timed via
        'protectionDurationMinutes'), or 'deleteAt' to schedule deletion. The two are mutually exclusive."
      properties:
        protected:
          type: boolean
          description: Enable or disable deletion protection. Omit to leave unchanged.
        protectionDurationMinutes:
          type: integer
          format: int64
          minimum: 0
          description: Protection duration in minutes. 0 or omitted means indefinite, unless the server's protectionMaxDurationMinutes cap is set, in which case it is limited to that many minutes.
        deleteAt:
          type: string
          format: date-time
          description: Schedule deletion at this time. Clears protection. Mutually exclusive with 'protected'.
    UpdateBranchResponse:
      type: object
      description: "Result of a branch protection update. Only the branch name and the protection
        fields are populated; the other branch attributes are returned empty."
      properties:
        name:
          type: string
        protected:
          type: boolean
          description: Whether the branch is protected from deletion (manual and auto-deletion).
        protectedTill:
          type: string
          format: date-time
          description: Time until which the branch is protected; omitted means indefinite when protected, or none.
        deleteAt:
          type: string
          format: date-time
          description: Scheduled auto-deletion time; omitted means none. Mutually exclusive with protection.
    StartObservationRequest:
      type: object
      properties:
        clone_id:
          type: string
        config:
          $ref: '#/components/schemas/ObservationConfig'
        tags:
          type: object
          additionalProperties:
            type: string
        db_name:
          type: string
    ObservationConfig:
      type: object
      properties:
        observation_interval:
          type: integer
          format: int64
        max_lock_duration:
          type: integer
          format: int64
        max_duration:
          type: integer
          format: int64
    ObservationSession:
      type: object
      properties:
        session_id:
          type: integer
          format: int64
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        config:
          $ref: '#/components/schemas/ObservationConfig'
        tags:
          type: object
          additionalProperties:
            type: string
        artifacts:
          type: array
          items:
            type: string
        result:
          $ref: '#/components/schemas/ObservationResult'
    ObservationResult:
      type: object
      properties:
        status:
          type: string
        intervals:
          type: array
          items:
            $ref: '#/components/schemas/ObservationInterval'
        summary:
          $ref: '#/components/schemas/ObservationSummary'
    ObservationInterval:
      type: object
      properties:
        started_at:
          type: string
          format: date-time
        duration:
          type: number
          format: double
        warning:
          type: string
    ObservationSummary:
      type: object
      properties:
        total_duration:
          type: number
          format: double
        total_intervals:
          type: integer
          format: int
        warning_intervals:
          type: integer
          format: int
        checklist:
          $ref: '#/components/schemas/ObservationChecklist'
    ObservationChecklist:
      type: object
      properties:
        overall_success:
          type: boolean
        session_duration_acceptable:
          type: boolean
        no_long_dangerous_locks:
          type: boolean
    StopObservationRequest:
      type: object
      properties:
        clone_id:
          type: string
        overall_error:
          type: boolean
    ObservationSummaryArtifact:
      type: object
      properties:
        session_id:
          type: integer
          format: int64
        clone_id:
          type: string
        duration:
          type: object
          properties: {}
        db_size:
          type: object
          properties: {}
        locks:
          type: object
          properties: {}
        log_errors:
          type: object
          properties: {}
        artifact_types:
          type: array
          items:
            type: string
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
    ResponseStatus:
      type: object
      properties:
        status:
          type: string
        message:
          type: string
    Config:
      type: object
      description: "Configuration parameters that can be changed via API, nested as in the configuration file."
      properties:
        retrievalMode:
          type: string
          enum:
          - logical
          - physical
          - unknown
          description: "Retrieval mode of the instance. GET returns the current mode. POST uses it to decide
            which retrieval fields are accepted; when omitted, the running mode is used, and fields of the other
            mode are rejected."
      additionalProperties: true
    Connection:
      type: object
      properties:
        host:
          type: string
        port:
          type: string
        dbname:
          type: string
        username:
          type: string
        password:
          type: string
        db_list:
          type: array
          items:
            type: string
    WSToken:
      type: object
      properties:
        token:
          type: string
          description: WebSocket token
    Branch:
      type: object
      properties:
        name:
          type: string
        baseDataset:
          type: string
        parent:
          type: string
        dataStateAt:
          type: string
          description: Data state time in UTC, formatted as YYYYMMDDHHMMSS
          example: '20230509212711'
        snapshotID:
          type: string
        dataset:
          type: string
        numSnapshots:
          type: integer
        protected:
          type: boolean
          description: Whether the branch is protected from deletion (manual and auto-deletion).
        protectedTill:
          type: string
          format: date-time
          description: Time until which the branch is protected; omitted means indefinite when protected, or none.
        deleteAt:
          type: string
          format: date-time
          description: Scheduled auto-deletion time; omitted means none. Mutually exclusive with protection.
    SnapshotDetails:
      type: object
      properties:
        id:
          type: string
        parent:
          type: string
        child:
          type: array
          nullable: true
          items:
            type: string
        branch:
          type: array
          nullable: true
          items:
            type: string
        root:
          type: array
          nullable: true
          items:
            type: string
        dataStateAt:
          type: string
          description: Data state time in UTC, formatted as YYYYMMDDHHMMSS
          example: '20230509212711'
        message:
          type: string
        dataset:
          type: string
        clones:
          type: array
          nullable: true
          items:
            type: string
        protected:
          type: boolean
          description: Whether the snapshot is protected from deletion (manual, retention, and auto-deletion).
        protectedTill:
          type: string
          format: date-time
          description: Time until which the snapshot is protected; omitted means indefinite when protected, or none.
        deleteAt:
          type: string
          format: date-time
          description: Scheduled auto-deletion time; omitted means none. Mutually exclusive with protection.
    FullRefresh:
      type: object
      properties:
        status:
          type: string
          example: OK
        message:
          type: string
          example: Full refresh started
    CreatedSnapshot:
      type: object
      description: Snapshot created by POST /snapshot, as reported by the pool manager
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        dataStateAt:
          type: string
          format: date-time
        used:
          type: integer
          format: int64
          description: Physical space used by the snapshot, in bytes
        logicalReferenced:
          type: integer
          format: int64
          description: Logical size of the data referenced by the snapshot, in bytes
        pool:
          type: string
        branch:
          type: string
        message:
          type: string
    TestConnectionResponse:
      type: object
      properties:
        status:
          type: string
          enum:
          - ok
          - notice
          - warning
          - error
        result:
          type: string
          description: Result code, for example 'ok', 'connection_error', 'query_error', 'missing_extension'
        message:
          type: string
        dbVersion:
          type: integer
          description: Major version of the source database, when it could be detected
        tuningParams:
          type: object
          additionalProperties:
            type: string
    ProbeSourceRequest:
      type: object
      required:
      - url
      properties:
        url:
          type: string
          description: "Source connection string: a postgresql:// URI or a keyword/value DSN with a single host.
            It must not contain the password."
          example: postgresql://john@db.example.com:5432/app?sslmode=require
        password:
          type: string
    ProposedConfig:
      type: object
      properties:
        source:
          $ref: '#/components/schemas/SourceConnection'
        detectedProvider:
          type: string
        dockerImage:
          type: string
        dockerTag:
          type: string
        resolvedImage:
          type: string
        pgMajorVersion:
          type: integer
