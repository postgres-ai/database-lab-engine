# Conditions.
.only_ui_feature: &only_ui_feature
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - ui/**/*

.only_ui_master: &only_ui_master
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - ui/**/*

# The two v-tag shapes the engine e2e matrix runs on, matched exactly because the release job below
# is gated on that matrix: a broader pattern would admit tags that create the publish job but none of
# the jobs it needs, and the tag pipeline would fail to generate.
.only_ui_tag_release: &only_ui_tag_release
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9.]+$/
    - if: $CI_COMMIT_TAG =~ /^v[0-9.]+[\-_]*[a-zA-Z]+[a-zA-Z0-9.\-_]*[a-zA-Z0-9]+$/

.ui_cache: &ui_cache
  image:
    name: node:lts-alpine
    pull_policy: always
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - .pnpm-store
    policy: pull

# Jobs templates.
.build_definition: &build_definition
  <<: *ui_cache
  image: docker:24
  stage: build-staging
  services:
    - name: docker:24-dind
      alias: docker
      command: [ "--tls=false" ]
  script:
    - apk add --no-cache bash
    - bash ./ui/packages/ce/ci_docker_build_push.sh
  needs:
    - job: check-code-style
      artifacts: false

# Jobs.

# Pushes to Docker Hub, so it sits in publish behind the same e2e matrix as the engine release
# images rather than in build-staging alongside the images those tests pull. The gate jobs have no
# `needs:` of their own and so wait for the whole test stage, which covers check-code-style.
ui_build_ce_image_release:
  <<: *build_definition
  <<: *only_ui_tag_release
  stage: publish
  needs: !reference [.e2e_gate, needs]
  variables:
    REGISTRY_USER: "${DH_CI_REGISTRY_USER}"
    REGISTRY_PASSWORD: "${DH_CI_REGISTRY_PASSWORD}"
    REGISTRY: "${DH_CI_REGISTRY}"
    DOCKER_NAME: "postgresai/ce-ui"
  before_script:
    - export UI_VERSION=$(echo ${CI_COMMIT_TAG#"v"})
    - export TAGS="${DOCKER_NAME}:${UI_VERSION}"
    # Only a stable release becomes the image `latest` resolves to. A letter in the version is what
    # separates the two tag shapes above, so it is what decides here too.
    - case "$UI_VERSION" in *[a-zA-Z]*) ;; *) export TAGS="${TAGS},${DOCKER_NAME}:latest" ;; esac

ui_build_ce_image_master:
  <<: *build_definition
  <<: *only_ui_master
  variables:
    REGISTRY_USER: "${CI_REGISTRY_USER}"
    REGISTRY_PASSWORD: "${CI_REGISTRY_PASSWORD}"
    REGISTRY: "${CI_REGISTRY}"
    DOCKER_NAME: "registry.gitlab.com/postgres-ai/database-lab/ce-ui"
    TAGS: "${DOCKER_NAME}:master,${DOCKER_NAME}:master-${CI_COMMIT_SHORT_SHA}"

ui_build_ce_image_dev:
  <<: *build_definition
  <<: *only_ui_feature
  variables:
    REGISTRY_USER: "${CI_REGISTRY_USER}"
    REGISTRY_PASSWORD: "${CI_REGISTRY_PASSWORD}"
    REGISTRY: "${CI_REGISTRY}"
    DOCKER_NAME: "${CI_REGISTRY}/${CI_PROJECT_NAMESPACE}/${CI_PROJECT_NAME}/ce-ui"
    TAGS: "${DOCKER_NAME}:${CI_COMMIT_REF_SLUG}"

trivy-ce-image-master:
  extends: .trivy_image_scan
  <<: *only_ui_master
  needs:
    - ui_build_ce_image_master
  variables:
    TRIVY_IMAGES: "${CI_REGISTRY_IMAGE}/ce-ui:master-${CI_COMMIT_SHORT_SHA}"

trivy-ce-image-feature:
  extends: .trivy_image_scan
  <<: *only_ui_feature
  needs:
    - ui_build_ce_image_dev
  variables:
    TRIVY_IMAGES: "${CI_REGISTRY_IMAGE}/ce-ui:${CI_COMMIT_REF_SLUG}"
