.only_ui_feature: &only_ui_feature
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - ui/**/*

# The two v-tag shapes the engine e2e matrix runs on, matched exactly because the release job below
# is gated on that matrix: a broader pattern would admit tags that create the publish job but none of
# the jobs it needs, and the tag pipeline would fail to generate.
.only_ui_tag_release: &only_ui_tag_release
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9.]+$/
    - if: $CI_COMMIT_TAG =~ /^v[0-9.]+[\-_]*[a-zA-Z]+[a-zA-Z0-9.\-_]*[a-zA-Z0-9]+$/

.shared_base: &shared_base
  image:
    name: node:lts-alpine
    pull_policy: always
  allow_failure: true
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - .pnpm-store
  before_script:
    - apk add --no-cache rsync jq
    - corepack enable
    - corepack prepare pnpm@8.15.9 --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm --dir ui/packages/shared install --frozen-lockfile

publish-shared-preview:
  <<: [*shared_base, *only_ui_feature]
  stage: build-staging
  script:
    - cd ui/packages/shared
    - echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > .npmrc

    # Get base version from package.json (strip any suffix)
    - BASE_VERSION=$(jq -r .version package.json)
    - BASE_VERSION=${BASE_VERSION%%-*}
    - export PREID="pr-${CI_MERGE_REQUEST_IID:-preview}"

    # Get all existing versions
    - EXISTING_TAGS=$(npm view @postgres.ai/shared versions --json | jq -r '.[]' || echo "")

    # Find next available version suffix
    - VERSION=""
    - for i in $(seq 0 20); do
        CANDIDATE="${BASE_VERSION}-${PREID}";
        [ "$i" -gt 0 ] && CANDIDATE="${CANDIDATE}.${i}";
        if ! echo "$EXISTING_TAGS" | grep -qx "$CANDIDATE"; then
          VERSION="$CANDIDATE";
          break;
        fi;
      done
    - if [ -z "$VERSION" ]; then echo "❌ Failed to determine unique preview version"; exit 1; fi
    - echo "Publishing version $VERSION"
    - npm version "$VERSION" --no-git-tag-version

    # Build and pack
    - pnpm run pack

    # Publish .tgz archive
    - TARBALL=$(ls postgres.ai-shared-*.tgz)
    - npm publish "$TARBALL" --tag "$PREID"

# Publishes to the public npm registry, so it waits on the same e2e matrix as the release images.
publish-shared-release:
  <<: [*shared_base, *only_ui_tag_release]
  stage: publish
  needs: !reference [.e2e_gate, needs]
  script:
    - cd ui/packages/shared
    - echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > .npmrc

    # Extract version from tag (remove leading "v")
    - export VERSION=${CI_COMMIT_TAG#"v"}

    # Build and pack
    - npm version "$VERSION" --no-git-tag-version --allow-same-version
    - pnpm run pack

    # Publish: stable releases go to the "latest" dist-tag, prereleases (e.g. 4.2.0-rc.1)
    # go to a channel dist-tag matching their identifier (rc/beta/alpha), since npm refuses
    # to publish a prerelease version to "latest" without an explicit --tag.
    - TARBALL=$(ls postgres.ai-shared-*.tgz)
    - DIST_TAG=latest
    - case "$VERSION" in *-*) PRERELEASE=${VERSION#*-}; DIST_TAG=${PRERELEASE%%.*} ;; esac
    - pnpm publish "$TARBALL" --no-git-checks --tag "$DIST_TAG"