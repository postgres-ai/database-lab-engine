include:
  - local: 'ui/packages/ce/.gitlab-ci.yml'
  - local: 'ui/packages/shared/.gitlab-ci.yml'

.ui_checks: &ui_checks
  rules:
    - if: $CI_COMMIT_TAG =~ /^ui\/[0-9.]+$/
    - if: $CI_COMMIT_TAG =~ /^v[a-zA-Z0-9_.-]*/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - ui/**/*
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - ui/**/*

.ui_cache: &ui_cache
  image: node:22-alpine
  cache: &cache
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - cache/Cypress
      - .pnpm-store
    policy: pull

check-code-style:
  <<: *ui_checks
  <<: *ui_cache
  stage: test
  before_script:
    - corepack enable
    - corepack prepare pnpm@8.15.9 --activate
    - export PNPM_HOME=/usr/local/bin
    - pnpm config set store-dir /builds/postgres-ai/database-lab/.pnpm-store/

  script:
    - pnpm --dir ui/ i
    - pnpm --dir ui/ --filter @postgres.ai/ce lint
  interruptible: true
  cache:
    <<: *cache
    policy: push

.ui_pnpm_setup: &ui_pnpm_setup
  - corepack enable
  - corepack prepare pnpm@8.15.9 --activate
  - export PNPM_HOME=/usr/local/bin
  - pnpm config set store-dir /builds/postgres-ai/database-lab/.pnpm-store/

ce-unit-tests:
  <<: *ui_checks
  <<: *ui_cache
  stage: test
  variables:
    CYPRESS_INSTALL_BINARY: "0"
  before_script: *ui_pnpm_setup
  script:
    - pnpm --dir ui/ install --frozen-lockfile
    - pnpm --dir ui/ --filter @postgres.ai/ce test
  interruptible: true

# The result depends on the advisory database at run time, not on the commit,
# so a newly published CVE must not block unrelated merge requests.
ce-dependency-audit:
  <<: *ui_checks
  <<: *ui_cache
  stage: test
  allow_failure: true
  variables:
    CYPRESS_INSTALL_BINARY: "0"
  before_script: *ui_pnpm_setup
  script:
    - pnpm --dir ui/ install --frozen-lockfile
    - pnpm --dir ui/ audit --prod --audit-level high
  interruptible: true

semgrep-sast:
  stage: test
  image:
    name: returntocorp/semgrep
    pull_policy: always
  <<: *ui_checks
  variables:
    # See more at semgrep.dev/explore.
    SEMGREP_RULES: >-
      p/security-audit
      p/secrets
      p/default
      p/owasp-top-ten
      p/javascript
      p/react
    # Upload findings to GitLab SAST Dashboard:
    SEMGREP_GITLAB_JSON: "1"
  script: semgrep ci --gitlab-sast > gl-sast-report.json || true
  artifacts:
    reports:
      sast: gl-sast-report.json

e2e-ce-ui-test:
  <<: *ui_checks
  image: node:22
  stage: integration-test
  variables:
    CYPRESS_CACHE_FOLDER: '$CI_PROJECT_DIR/cache/Cypress'
  before_script:
    - apt update
    - apt install -y curl libgtk2.0-0 libgtk-3-0 libgbm-dev libnotify-dev libgconf-2-4 libnss3 libxss1 libasound2 libxtst6 xauth xvfb
    - npm install -g wait-on
    - npm install -g pnpm@8.15.9
  script:
    - pnpm --dir ui/ --filter @postgres.ai/ce install
    - pnpm --dir ui/ --filter @postgres.ai/ce build
    - pnpm --dir ui/ --filter @postgres.ai/ce exec cypress install
    - npx serve -s ui/packages/ce/build -l 3001 > server.log 2>&1 &
    - sleep 20
    - timeout 120s wait-on http://localhost:3001 || (echo "❌ UI didn't start in time"; cat server.log; exit 1)
    - pnpm --dir ui/ --filter @postgres.ai/ce cy:run
